  <script>
    (function () {
      var d = document.documentElement;
      d.classList.remove('no-js');
      d.classList.add('js', 'is-loading');
      // Reduced motion: the OS setting, or ?motion=reduce (the test switch in the README).
      var reduceParam = /[?&]motion=reduce(&|$)/.test(window.location.search);
      try {
        if (reduceParam || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
          d.classList.add('reduced-motion');
        }
      } catch (e) {
        if (reduceParam) d.classList.add('reduced-motion');
      }
      // Slow networks: until the page script takes over, keep the counter moving a little
      // (to 30% at most). loader.js continues from the number shown, never backwards.
      var PRE_STEP_MS = 400, PRE_CAP = 30, pre = 0;
      var preTimer = window.setInterval(function () {
        var loader = document.getElementById('loader');
        var pct = document.getElementById('loader-percent');
        var taken = d.classList.contains('rendered') || d.classList.contains('boot-failed');
        // No #loader yet while the body is still being parsed: wait for it.
        var gone = loader ? loader.classList.contains('is-running') : document.readyState !== 'loading';
        if (taken || gone || pre >= PRE_CAP) {
          window.clearInterval(preTimer);
          return;
        }
        if (pct) {
          pre = Math.min(PRE_CAP, pre + 1 + Math.round(Math.random() * 2));
          pct.textContent = pre + '%';
        }
      }, PRE_STEP_MS);
      // Last-resort failsafe: if the page script never renders (blocked, 404, crash), show the
      // plain fallback content and release the scroll lock. While the deferred scripts are still
      // downloading (DOMContentLoaded waits for them), keep waiting, up to 30s in all.
      var FAILSAFE_MS = 9000, RETRY_MS = 1000, CAP_MS = 30000, t0 = Date.now(), parsed = false;
      document.addEventListener('DOMContentLoaded', function () { parsed = true; });
      function failsafe() {
        if (d.classList.contains('rendered')) return;
        if (!parsed && Date.now() - t0 < CAP_MS) {
          window.setTimeout(failsafe, RETRY_MS);
          return;
        }
        var fallback = document.getElementById('nojs');
        var main = document.getElementById('main');
        if (fallback && main) main.insertAdjacentHTML('afterbegin', fallback.textContent);
        d.classList.remove('is-loading');
        d.classList.add('boot-failed');
      }
      window.setTimeout(failsafe, FAILSAFE_MS);
    })();
  </script>
